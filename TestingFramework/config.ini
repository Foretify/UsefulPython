[DEFAULT]
# Default number of runs for all tests (can be overridden per test)
runs = 2

[fast_test]
# Fast test will run 10 times
runs = 10

[slow_test]
# Slow test will run 3 times (fewer because it's slower)
runs = 3

[variable_test]
# Variable test will use default runs (5)

[failing_test]
# Failing test will run 20 times to see failure rate
runs = 20
